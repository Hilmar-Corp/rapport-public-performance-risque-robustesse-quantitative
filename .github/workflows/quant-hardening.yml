name: Quantitative hardening

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  typing:
    name: Strict Python typing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,hmm]"

      - name: Strict type checking
        run: python -m pyright

      - name: Numerical environment report
        env:
          TZ: UTC
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python tools/numeric_environment_report.py

  benchmark:
    name: Reference reproduction benchmark
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install exact environment
        run: |
          python -m pip install \
            -c requirements/constraints-py313.txt \
            -e ".[dev,hmm]"

      - name: Run benchmark
        env:
          PYTHONPATH: src
          TZ: UTC
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest \
            -q \
            -o addopts="" \
            benchmarks \
            --benchmark-only \
            --benchmark-json=benchmark-results.json

  mutation:
    name: Mutation testing
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,hmm]"

      - name: Run mutation testing
        env:
          PYTHONPATH: src
          TZ: UTC
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -m mutmut run
