name: Dependency and SBOM controls

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install             -c requirements/constraints-py313.txt             pip-audit

      - name: Audit exact dependencies
        run: |
          pip-audit             -r requirements/constraints-py313.txt             --strict             --progress-spinner off

      - name: Generate CycloneDX SBOM
        run: |
          pip-audit             -r requirements/constraints-py313.txt             --format cyclonedx-json             --output sbom.cdx.json             --progress-spinner off
          python tools/verify_sbom.py sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hilmarcorp-benchmark-suite-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
