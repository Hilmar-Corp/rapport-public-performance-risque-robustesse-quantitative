name: Release provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Attested institutional release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve controlled release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi

          if ! printf '%s' "$release_tag" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $release_tag"
            exit 1
          fi

          git fetch \
            --force \
            origin \
            "refs/tags/$release_tag:refs/tags/$release_tag"

          source_commit="$(
            git rev-list \
              -n 1 \
              "$release_tag"
          )"

          if [ -z "$source_commit" ]; then
            echo "Unable to resolve release commit."
            exit 1
          fi

          git checkout \
            --detach \
            "$source_commit"

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

          echo "Release tag   : $release_tag"
          echo "Source commit : $source_commit"

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")

          values = {
              "pyproject.toml": re.search(
                  r'^version = "([^"]+)"',
                  Path("pyproject.toml").read_text(
                      encoding="utf-8",
                  ),
                  flags=re.MULTILINE,
              ).group(1),
              "src/hilmarbench/__init__.py": re.search(
                  r'^__version__ = "([^"]+)"',
                  Path(
                      "src/hilmarbench/__init__.py"
                  ).read_text(
                      encoding="utf-8",
                  ),
                  flags=re.MULTILINE,
              ).group(1),
              "CITATION.cff": re.search(
                  r"^version: (.+)$",
                  Path("CITATION.cff").read_text(
                      encoding="utf-8",
                  ),
                  flags=re.MULTILINE,
              ).group(1).strip(),
          }

          for source, value in values.items():
              if value != expected:
                  raise SystemExit(
                      f"{source}: {value} != {expected}"
                  )

          release = Path("artifacts/releases") / tag

          if not release.is_dir():
              raise SystemExit(
                  f"Versioned release missing: {release}"
              )

          print("VERSION CONSISTENCY PASSED")
          PYTHON

      - name: Bootstrap controlled build backend
        run: |
          python -m pip install \
            --upgrade \
            "pip==26.2" \
            "setuptools==83.0.0" \
            "wheel==0.47.0"

      - name: Install exact controlled environment
        run: |
          python -m pip install \
            --no-build-isolation \
            -c requirements/constraints-py313.txt \
            -e ".[dev,hmm]"

      - name: Execute institutional controls
        env:
          PYTHONPATH: src
          TZ: UTC
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          bash scripts/reproduce_in_oci.sh

      - name: Build canonical OCI image
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "hilmarbench-release:$SOURCE_COMMIT" \
            .

          docker run \
            --platform linux/amd64 \
            --rm \
            "hilmarbench-release:$SOURCE_COMMIT"

      - name: Authenticate to GHCR
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Push canonical OCI image
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="$image_name:$RELEASE_TAG"

          docker tag \
            "hilmarbench-release:$SOURCE_COMMIT" \
            "$image_ref"

          docker push "$image_ref"
          docker pull "$image_ref"

          repo_digest="$(
            docker image inspect \
              "$image_ref" \
              --format '{{index .RepoDigests 0}}'
          )"

          image_digest="${repo_digest#*@}"

          if ! printf '%s' "$image_digest" \
            | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Invalid OCI digest: $image_digest"
            exit 1
          fi

          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

          mkdir -p build

          printf '%s@%s\n' \
            "$image_ref" \
            "$image_digest" \
            > build/oci-image-digest.txt

      - name: Generate SBOMs and provenance
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          source_date_epoch="$(
            git show \
              -s \
              --format=%ct \
              "$SOURCE_COMMIT"
          )"

          export SOURCE_DATE_EPOCH="$source_date_epoch"

          release_version="${RELEASE_TAG#v}"

          mkdir -p build/sbom
          mkdir -p build/release-assets

          python tools/generate_python_sboms.py \
            --source-version "$release_version" \
            --cyclonedx-output build/sbom/cyclonedx.json \
            --spdx-output build/sbom/spdx.json

          python tools/build_provenance_manifest.py \
            --release-dir "artifacts/releases/$RELEASE_TAG" \
            --output build/provenance-manifest.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$RELEASE_TAG" \
            --workflow-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --base-image "$(cat docker/python-base-image.txt)" \
            --image-reference "$IMAGE_REFERENCE" \
            --image-digest "$IMAGE_DIGEST" \
            --constraints requirements/constraints-py313.txt \
            --cyclonedx build/sbom/cyclonedx.json \
            --spdx build/sbom/spdx.json

          cp \
            "artifacts/releases/$RELEASE_TAG/"* \
            build/release-assets/

          cp \
            requirements/constraints-py313.txt \
            build/release-assets/

          cp \
            build/sbom/cyclonedx.json \
            build/release-assets/

          cp \
            build/sbom/spdx.json \
            build/release-assets/

          cp \
            build/provenance-manifest.json \
            build/release-assets/

          cp \
            build/oci-image-digest.txt \
            build/release-assets/

          (
            cd build/release-assets || exit 1

            find . \
              -maxdepth 1 \
              -type f \
              ! -name RELEASE_SHA256SUMS \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > RELEASE_SHA256SUMS
          )

          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf build/release-evidence.tar.gz \
            -C build \
            release-assets

      - name: Attest OCI image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.image_digest }}
          push-to-registry: true

      - name: Attest evidence archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: build/release-evidence.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"

          if ! gh release view "$RELEASE_TAG" \
            >/dev/null 2>&1; then

            gh release create \
              "$RELEASE_TAG" \
              --title "Institutional quantitative evidence release - $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

          for asset in build/release-assets/*; do
            gh release upload \
              "$RELEASE_TAG" \
              "$asset" \
              --clobber
          done

          gh release upload \
            "$RELEASE_TAG" \
            build/release-evidence.tar.gz \
            --clobber
