[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hilmarcorp-benchmark-suite"
version = "0.2.1"
description = "Transparent benchmark and backtesting utilities for daily allocation strategies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "arch>=8,<9",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
hmm = [
    "hmmlearn>=0.3",
    "scikit-learn>=1.3",
]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "pytest-benchmark>=5.2,<6",
    "pyright>=1.1.390,<2",
    "scipy-stubs",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-config",
    "--strict-markers",
    "--cov=hilmarbench",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "slow: computationally intensive integration tests",
    "benchmark: performance and regression benchmarks",
]
filterwarnings = [
    "error",
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\\.5\\.:DeprecationWarning:hmmlearn\\.utils",
]

[tool.coverage.run]
branch = true
source = ["hilmarbench"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "All"
useLibraryCodeForTypes = true

# Les bibliothèques scientifiques exposent encore des portions non typées.
# Les erreurs concrètes restent actives : attributs invalides, opérateurs,
# arguments, retours, paramètres et incompatibilités d'affectation.
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
